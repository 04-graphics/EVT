<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EventPass Scanner</title>
  <script src="js/html5-qrcode.min.js"></script>
  <script src="js/api.js"></script>
  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(16,26,46,.90);
      --line:rgba(255,255,255,.08);
      --text:#e8eefc;
      --muted:#90a0c0;
      --brand:#4f46e5;
      --success:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --shadow:0 24px 70px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 0%, #1d4ed833 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 15%, #14b8a633 0%, transparent 55%),
        linear-gradient(180deg,#0b1220 0%, #0f172a 100%);
      padding:16px;
    }
    .wrap{max-width:820px;margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
    .brand h1{font-size:22px;line-height:1.1}
    .pill{padding:10px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--text);font-size:13px;text-decoration:none;white-space:nowrap}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(14px)}
    .hero{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
    .hero h2{font-size:18px;margin-bottom:6px}
    .hero p{font-size:13px;color:var(--muted);line-height:1.55;max-width:62ch}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 0}
    .meta .box{border:1px solid var(--line);border-radius:18px;padding:14px 14px 13px;background:rgba(255,255,255,.03)}
    .meta .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .meta .v{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .scanner{padding:20px}
    #reader{width:100%;min-height:340px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#050b16}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{border:none;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;color:#fff}
    .btn.primary{background:var(--brand)}
    .btn.gray{background:#334155}
    .btn.good{background:var(--success)}
    .btn.warning{background:linear-gradient(180deg,#f59e0b 0%, #d97706 100%)}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    .status{margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px;line-height:1.45}
    .status strong{color:var(--text)}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.68);padding:18px;z-index:999}
    .popup.show{display:flex}
    .popup-card{width:100%;max-width:480px;border-radius:28px;background:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);color:#0f172a;box-shadow:0 30px 90px rgba(0,0,0,.38);overflow:hidden;border:1px solid rgba(15,23,42,.08)}
    .popup-head{padding:22px 22px 16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid rgba(15,23,42,.08)}
    .popup-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex:0 0 auto;background:#eaffef;color:#16a34a}
    .popup-icon.warn{background:#fff7e6;color:#b45309}
    .popup-icon.bad{background:#fff1f2;color:#dc2626}
    .popup-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#64748b;margin-bottom:6px}
    .popup-title{font-size:24px;line-height:1.15;margin-bottom:6px}
    .popup-subtitle{font-size:14px;color:#475569;line-height:1.5}
    .ticket{padding:18px 22px 6px}
    .ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{padding:14px;border:1px solid rgba(15,23,42,.08);border-radius:18px;background:#fff}
    .field.full{grid-column:1 / -1}
    .label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:6px;font-weight:700}
    .value{font-size:16px;line-height:1.4;color:#0f172a;word-break:break-word}
    .value.mono{font-variant-numeric:tabular-nums}
    .popup-actions{display:flex;gap:10px;padding:0 22px 22px;margin-top:16px;flex-wrap:wrap}
    .popup-actions .btn{flex:1 1 150px}
    .btn.outline-dark{background:#fff;border:1px solid rgba(15,23,42,.12);color:#0f172a}
    .btn.success{background:linear-gradient(180deg,#22c55e 0%, #16a34a 100%)}
    .btn.danger{background:linear-gradient(180deg,#ef4444 0%, #dc2626 100%)}
    .btn.large{min-height:48px;font-size:15px}
    @media (max-width:560px){
      .meta{grid-template-columns:1fr}
      #reader{min-height:290px}
      .popup-head{padding:20px 18px 14px}
      .ticket{padding:16px 18px 4px}
      .ticket-grid{grid-template-columns:1fr}
      .popup-actions{padding:0 18px 18px}
      .popup-title{font-size:21px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <small>EventPass Lite</small>
        <h1>Scanner</h1>
      </div>
      <a class="pill" id="backLink" href="#">Back</a>
    </div>

    <div class="card">
      <div class="hero">
        <h2 id="helloText">Ready to scan</h2>
        <p>Scan a QR code to preview the ticket first. Nothing is marked used until the staff presses Check In.</p>
      </div>

      <div class="meta">
        <div class="box">
          <div class="k">Staff</div>
          <div class="v" id="staffLabel">Unknown</div>
        </div>
        <div class="box">
          <div class="k">Gate</div>
          <div class="v" id="gateLabel">Scanner</div>
        </div>
      </div>

      <div class="scanner">
        <div id="reader"></div>
        <div class="actions">
          <button class="btn primary" id="startBtn">Start camera</button>
          <button class="btn gray" id="stopBtn">Stop</button>
        </div>
        <div class="status" id="statusBox">
          <strong>Status:</strong> waiting to start camera
        </div>
      </div>
    </div>
  </div>

  <div class="popup" id="popup" aria-hidden="true">
    <div class="popup-card" id="popupCard" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div class="popup-head">
        <div class="popup-icon" id="popupIcon">✓</div>
        <div>
          <div class="popup-eyebrow" id="popupEyebrow">VALID TICKET</div>
          <div class="popup-title" id="popupTitle">Ticket Preview</div>
          <div class="popup-subtitle" id="popupSubtitle"></div>
        </div>
      </div>
      <div class="ticket">
        <div class="ticket-grid" id="popupDetails"></div>
      </div>
      <div class="popup-actions" id="popupActions"></div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const STAFF_NAME = qs.get('staff') || 'Scanner';
    const BACK_URL = qs.get('back') || 'staff.html';
    const GATE_LABEL = qs.get('gate') || 'Scanner';

    document.getElementById('staffLabel').textContent = STAFF_NAME;
    document.getElementById('gateLabel').textContent = GATE_LABEL;
    document.getElementById('backLink').href = BACK_URL;
    document.getElementById('backLink').textContent = 'Back';
    document.getElementById('helloText').textContent = `Hello, ${STAFF_NAME}`;

    let qr = null;
    let lastScanned = '';
    let scanLock = false;
    let currentTicketId = '';

    function setStatus(html) {
      document.getElementById('statusBox').innerHTML = html;
    }

    function extractTicketId(qrText) {
      const parts = String(qrText || '').split('|').map(s => s.trim());
      return parts[2] || parts[0] || '';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stopScanner() {
      if (!qr) return Promise.resolve();

      const instance = qr;
      qr = null;
      return instance.stop()
        .catch(() => {})
        .finally(() => {
          try { instance.clear(); } catch (e) {}
          setStatus('<strong>Status:</strong> camera stopped');
        });
    }

    async function startCamera() {
      if (qr) return;
      if (!window.Html5Qrcode) {
        setStatus('<strong>Status:</strong> scanner library failed to load');
        return;
      }

      try {
        setStatus('<span class="spinner"></span> <strong>Starting camera…</strong>');
        qr = new Html5Qrcode('reader');

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) {
          setStatus('<strong>Status:</strong> no camera found');
          showPopup({
            kind: 'invalid',
            eyebrow: 'CAMERA ERROR',
            title: 'No camera found',
            icon: '❌',
            subtitle: 'Please open this page on a device with a camera.',
            details: [['Ticket ID', '—'], ['Status', 'Camera unavailable']],
            actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
          });
          return;
        }

        const rear = cameras.find(c => /back|rear|environment/i.test(c.label));
        const cameraId = rear ? rear.id : cameras[0].id;

        await qr.start(
          cameraId,
          { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
          onScanSuccess,
          () => {}
        );

        setStatus('<strong>Status:</strong> camera ready');
      } catch (err) {
        console.error(err);
        setStatus('<strong>Status:</strong> camera blocked or unavailable');
        showPopup({
          kind: 'invalid',
          eyebrow: 'CAMERA ERROR',
          title: 'Camera blocked',
          icon: '❌',
          subtitle: 'Open this page in Chrome or Safari, not inside an in-app browser.',
          details: [['Ticket ID', '—'], ['Status', 'Camera blocked']],
          actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
        });
        try { if (qr) { await qr.clear(); } } catch (e) {}
        qr = null;
      }
    }

    function resetScanState() {
      lastScanned = '';
      scanLock = false;
      currentTicketId = '';
    }

    function showPopup({ kind, eyebrow, title, icon, subtitle, details, actions }) {
      const popup = document.getElementById('popup');
      const popupCard = document.getElementById('popupCard');
      const popupIcon = document.getElementById('popupIcon');
      const popupEyebrow = document.getElementById('popupEyebrow');
      const popupTitle = document.getElementById('popupTitle');
      const popupSubtitle = document.getElementById('popupSubtitle');
      const popupDetails = document.getElementById('popupDetails');
      const popupActions = document.getElementById('popupActions');

      popup.classList.add('show');
      popup.setAttribute('aria-hidden', 'false');
      popupCard.style.borderTop = 'none';

      popupIcon.className = 'popup-icon';
      if (kind === 'used') popupIcon.classList.add('warn');
      if (kind === 'invalid' || kind === 'error') popupIcon.classList.add('bad');

      popupIcon.textContent = icon || '✓';
      popupEyebrow.textContent = eyebrow || '';
      popupTitle.textContent = title || '';
      popupSubtitle.textContent = subtitle || '';

      popupDetails.innerHTML = (details || []).map(([label, value], idx) => {
        const full = idx === 0 && (kind === 'success' || kind === 'error');
        return `
          <div class="field ${full ? 'full' : ''}">
            <span class="label">${label}</span>
            <div class="value ${/ID|Time|Phone/.test(label) ? 'mono' : ''}">${escapeHtml(value || '')}</div>
          </div>
        `;
      }).join('');

      popupActions.innerHTML = (actions || []).map((action, idx) => {
        const cls = action.style || 'outline-dark';
        const large = action.large === false ? '' : ' large';
        const id = `popupAction_${idx}`;
        setTimeout(() => {
          const btn = document.getElementById(id);
          if (btn) btn.onclick = action.onClick;
        }, 0);
        return `<button class="btn ${cls}${large}" id="${id}" type="button">${escapeHtml(action.label || 'Button')}</button>`;
      }).join('');
    }

    function closePopup() {
      const popup = document.getElementById('popup');
      popup.classList.remove('show');
      popup.setAttribute('aria-hidden', 'true');
      resetScanState();
      stopScanner().finally(() => {
        startCamera();
      });
    }

    function showConnectionError(message) {
      setStatus('<strong>Status:</strong> <span style="color:#ef4444">connection error</span>');
      showPopup({
        kind: 'error',
        eyebrow: 'CONNECTION ERROR',
        title: 'Connection Error',
        icon: '❌',
        subtitle: message || 'Could not reach the backend.',
        details: [['Ticket ID', currentTicketId || '—'], ['Status', 'Backend unreachable']],
        actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
      });
    }

    async function onScanSuccess(decodedText) {
      if (scanLock || decodedText === lastScanned) return;

      scanLock = true;
      lastScanned = decodedText;
      currentTicketId = extractTicketId(decodedText);

      await stopScanner();

      if (!currentTicketId) {
        setStatus('<strong>Status:</strong> <span style="color:#ef4444">invalid ticket</span>');
        showPopup({
          kind: 'invalid',
          eyebrow: 'INVALID TICKET',
          title: 'Invalid Ticket',
          icon: '❌',
          subtitle: 'No ticket ID found in the QR code.',
          details: [['Ticket ID', '—'], ['Status', 'Ticket not found.']],
          actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
        });
        return;
      }

      if (typeof api !== 'function') {
        showConnectionError('The shared API helper is missing.');
        return;
      }

      setStatus('<span class="spinner"></span> <strong>Validating ticket…</strong>');

      try {
        const res = await api('validateTicket', {
          ticketId: currentTicketId,
          staffName: STAFF_NAME,
          gateLabel: GATE_LABEL
        });

        console.log('Validation response:', res);

        if (res && res.success && res.status === 'VALID') {
          setStatus('<strong>Status:</strong> <span style="color:#22c55e">valid ticket</span>');
          showPopup({
            kind: 'valid',
            eyebrow: 'VALID TICKET',
            title: 'Ticket Preview',
            icon: '✓',
            subtitle: 'Review the ticket details before check-in.',
            details: [
              ['Ticket ID', res.ticketId || currentTicketId],
              ['Name', res.name || ''],
              ['Phone', res.phone || ''],
              ['Ticket Type', res.ticketType || ''],
              ['Status', 'Unused']
            ],
            actions: [
              { label: 'Cancel', style: 'outline-dark', onClick: closePopup },
              { label: 'Check In', style: 'success', onClick: () => checkInTicket(res.ticketId || currentTicketId) }
            ]
          });
          return;
        }

        if (res && res.status === 'ALREADY_USED') {
          setStatus('<strong>Status:</strong> <span style="color:#f59e0b">already used</span>');
          showPopup({
            kind: 'used',
            eyebrow: 'ALREADY USED',
            title: 'Ticket Already Used',
            icon: '⚠',
            subtitle: 'This ticket has already been checked in.',
            details: [
              ['Ticket ID', res.ticketId || currentTicketId],
              ['Checked In By', res.checkedInBy || 'Unknown'],
              ['Checked In Time', res.checkedInTime || 'Unknown']
            ],
            actions: [{ label: 'Close', style: 'warning', onClick: closePopup }]
          });
          return;
        }

        setStatus('<strong>Status:</strong> <span style="color:#ef4444">invalid ticket</span>');
        showPopup({
          kind: 'invalid',
          eyebrow: 'INVALID TICKET',
          title: 'Invalid Ticket',
          icon: '❌',
          subtitle: (res && res.error) || 'Ticket not found.',
          details: [['Ticket ID', currentTicketId], ['Status', 'Ticket not found.']],
          actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
        });
      } catch (err) {
        console.error(err);
        showConnectionError('Could not reach the Apps Script backend.');
      }
    }

    async function checkInTicket(ticketId) {
      if (!ticketId) {
        showPopup({
          kind: 'invalid',
          eyebrow: 'INVALID TICKET',
          title: 'Invalid Ticket',
          icon: '❌',
          subtitle: 'No ticket ID is available for check-in.',
          details: [['Ticket ID', '—'], ['Status', 'Check-in aborted']],
          actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
        });
        return;
      }

      if (typeof api !== 'function') {
        showConnectionError('The shared API helper is missing.');
        return;
      }

      setStatus('<span class="spinner"></span> <strong>Checking in…</strong>');

      try {
        const res = await api('checkIn', {
          ticketId,
          staffName: STAFF_NAME,
          gateLabel: GATE_LABEL
        });

        console.log('Check-in response:', res);

        if (res && res.success && res.status === 'VALID') {
          setStatus('<strong>Status:</strong> <span style="color:#22c55e">check-in successful</span>');
          showPopup({
            kind: 'success',
            eyebrow: 'CHECK-IN SUCCESSFUL',
            title: '✓ CHECK-IN SUCCESSFUL',
            icon: '✓',
            subtitle: 'The ticket has now been marked as used.',
            details: [
              ['Ticket ID', res.ticketId || ticketId],
              ['Checked In By', res.checkedInBy || 'Scanner'],
              ['Time', res.checkedInTime || '']
            ],
            actions: [{ label: 'Done', style: 'success', onClick: closePopup }]
          });
          return;
        }

        if (res && res.status === 'ALREADY_USED') {
          setStatus('<strong>Status:</strong> <span style="color:#f59e0b">already used</span>');
          showPopup({
            kind: 'used',
            eyebrow: 'ALREADY USED',
            title: 'Ticket Already Used',
            icon: '⚠',
            subtitle: 'This ticket has already been checked in.',
            details: [
              ['Ticket ID', res.ticketId || ticketId],
              ['Checked In By', res.checkedInBy || 'Unknown'],
              ['Checked In Time', res.checkedInTime || 'Unknown']
            ],
            actions: [{ label: 'Close', style: 'warning', onClick: closePopup }]
          });
          return;
        }

        setStatus('<strong>Status:</strong> <span style="color:#ef4444">invalid ticket</span>');
        showPopup({
          kind: 'invalid',
          eyebrow: 'INVALID TICKET',
          title: 'Invalid Ticket',
          icon: '❌',
          subtitle: (res && res.error) || 'Ticket not recognized.',
          details: [['Ticket ID', ticketId], ['Status', 'Ticket not found.']],
          actions: [{ label: 'Close', style: 'outline-dark', onClick: closePopup }]
        });
      } catch (err) {
        console.error(err);
        showConnectionError('Could not reach the Apps Script backend.');
      }
    }

    document.getElementById('startBtn').addEventListener('click', startCamera);
    document.getElementById('stopBtn').addEventListener('click', async () => {
      await stopScanner();
      setStatus('<strong>Status:</strong> camera stopped');
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        setStatus('<strong>Status:</strong> tap “Start camera” if it does not open automatically');
      }, 300);
    });
  </script>
</body>
</html>
